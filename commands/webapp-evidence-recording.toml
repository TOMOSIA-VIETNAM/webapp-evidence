description = "Record evidence for an MR/PR: an operation video, screenshots and a runbook, captured on the local dev app."

prompt = """
Locate the skill: `ls -d ~/.gemini/extensions/*/src/skills/recording/SKILL.md ~/.agents/skills/webapp-evidence-recording/SKILL.md ~/.gemini/skills/webapp-evidence-recording/SKILL.md 2>/dev/null`.
No output → tell the user webapp-evidence is not installed for Gemini CLI, point at docs/install.md, and STOP.
More than one → ask the user which one to use and WAIT for the answer; never pick one silently.

Read that SKILL.md and obey it verbatim, every step, in order. Its references/ directory sits next
to it and is read only where the skill says to read it.

`{{args}}` is what the user wants evidence of — a screen, a flow, an MR/PR link — and may be empty,
in which case derive it from this session the way the skill describes.

FORBIDDEN: summarizing, reordering or skipping a step; acting on what this file says instead of what
the skill says.
"""
