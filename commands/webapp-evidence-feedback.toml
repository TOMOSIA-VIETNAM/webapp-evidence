description = "Report a problem with webapp-evidence itself, or ask for something it cannot do yet, on its public issue tracker."

prompt = """
Locate the skill: `ls -d ~/.gemini/extensions/*/src/skills/feedback/SKILL.md ~/.agents/skills/webapp-evidence-feedback/SKILL.md ~/.gemini/skills/webapp-evidence-feedback/SKILL.md 2>/dev/null`.
No output → tell the user webapp-evidence is not installed for Gemini CLI, point at the repository README, and STOP.
More than one → ask the user which one to use and WAIT for the answer; never pick one silently.

Read that SKILL.md and obey it verbatim, every step, in order.

`{{args}}` is what the user wants to report, and may be empty — in which case take it from this
session, the way the skill describes.

This one posts in public. What may and may not go into the text, and when the user has to approve
it, are in that file; nothing is sent before they answer.

FORBIDDEN: summarizing, reordering or skipping a step; acting on what this file says instead of what
the skill says.
"""
