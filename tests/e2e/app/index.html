<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evidence demo — user search</title>
<style>
  :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* Plenty of real apps set this, and it changes what a recording has to cope with: a scroll the
     runner asks for is then animated rather than instant, so anything measuring a position right
     afterwards measures one the element is about to leave. */
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #f6f7f9; color: #1c2024; }
  /* Pinned, the way a marketing page or an app shell keeps its title bar in place. It covers the
     top band of the frame, so anything the runner leaves resting under it is on screen and
     unreadable — which is what the check on the section below measures. */
  header { background: #1f2937; color: #fff; padding: 14px 24px; font-weight: 600;
           position: sticky; top: 0; z-index: 5; }
  nav { background: #374151; color: #d1d5db; padding: 8px 24px; font-size: 13px; }
  nav a { color: #d1d5db; margin-right: 16px; text-decoration: none; }
  main { padding: 24px; max-width: 900px; }
  fieldset { border: 1px solid #d7dbe0; border-radius: 8px; background: #fff; padding: 16px; margin: 0 0 16px; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; font-size: 13px; margin: 10px 0 4px; color: #4b5563; }
  input[type=text], select { width: 260px; padding: 7px 9px; border: 1px solid #c4c9d0; border-radius: 6px; font-size: 14px; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  button.secondary { background: #6b7280; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
  th { background: #eef1f5; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #4b5563; }
  #empty { padding: 16px; color: #6b7280; font-size: 14px; background: #fff; border-radius: 8px; }
  /* Taller than the frame on purpose: the button under it can only be clicked after the page has
     been scrolled, which is the one thing a page that fits on screen cannot exercise. */
  #history { margin-top: 24px; background: #fff; border-radius: 8px; padding: 16px; }
  #history li { font-size: 13px; color: #4b5563; line-height: 2.6; }
  /* A section holding nothing to click: the only way to bring it into the frame is to scroll to
     it, and most of a screen tall is the height that gets left half past the fold by a scroll
     that places an element's middle rather than its bounds. */
  #summary { margin-top: 24px; background: #fff; border-radius: 8px; padding: 16px; height: 560px; }
  dialog { border: 0; border-radius: 10px; padding: 0; width: 380px; background: #fff;
           box-shadow: 0 18px 50px rgba(0,0,0,.28); }
  dialog::backdrop { background: rgba(15, 23, 42, .45); }
  dialog header { border-radius: 10px 10px 0 0; }
  dialog .body { padding: 18px; font-size: 14px; line-height: 1.5; }
  dialog .actions { padding: 0 18px 18px; text-align: right; }
  .file-row { margin-top: 12px; font-size: 13px; color: #4b5563; }
  /* The label in the markup is "Export report" and the label on screen is EXPORT REPORT. A probe
     that prints what it reads off the screen prints a name that matches nothing. */
  .export { text-transform: uppercase; }
</style>
</head>
<body>
<header>Evidence demo</header>
<nav><a href="#">Dashboard</a><a href="#">Users</a><a href="#">Settings</a></nav>
<main>
  <fieldset>
    <legend>Search conditions</legend>
    <label for="q_name_cont">Name contains</label>
    <input type="text" id="q_name_cont" name="q_name_cont" autocomplete="off">
    <label for="q_status_eq">Status</label>
    <select id="q_status_eq" name="q_status_eq">
      <option value="">Any</option>
      <option value="active">Active</option>
      <option value="suspended">Suspended</option>
    </select>
    <label for="import_file">Attach a list</label>
    <input type="file" id="import_file" name="import_file">
    <div class="file-row" id="file_name">No file chosen</div>
    <p><button id="search" type="button">Search</button>
       <button id="sync" class="secondary" type="button">Run sync</button>
       <button id="reveal_key" class="secondary" type="button">Reveal API key</button></p>
    <p><button id="ask" class="secondary" type="button">Delete selected</button>
       <button id="notify" class="secondary" type="button">Send notice</button>
       <!-- No id, so a probe has to name it by its role and its text — which is where the text
            the screen shows and the text the markup holds part company. -->
       <button class="secondary export" type="button">Export report</button>
       <!-- An apostrophe in the label: interpolated into a single-quoted selector it would print a
            line that is not JavaScript. -->
       <button class="secondary" type="button">Don't save</button>
       <span id="ask_result"></span></p>
    <!-- Dragged rather than clicked: a handle is what no other helper reaches. -->
    <label for="rows_shown">Rows shown</label>
    <!-- Starting at the middle of its own track: a press at the centre of the element lands on the
         value it already holds, so the step script's check can only pass on the travel between
         the press and the release. -->
    <p><input type="range" id="rows_shown" name="rows_shown" min="0" max="100" value="50" style="width:260px">
       <output id="rows_shown_value">50</output></p>
    <p><code id="api_key" hidden>demo_key_not_a_real_secret_0000</code></p>
  </fieldset>

  <div id="empty">No search has run yet.</div>
  <table id="results" hidden>
    <thead><tr><th>Code</th><th>Name</th><th>Status</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <section id="history">
    <h3>Audit trail</h3>
    <ol id="history_items"></ol>
    <p><button id="archive" type="button">Archive the trail</button>
       <span id="archive_result"></span></p>
    <!-- A frame of its own, a screenful below the button above it: what is measured inside one is
         in that frame's coordinates while the mouse is driven in this page's, and the page has to
         travel to reach it. A click that does not land proves one of the two was got wrong. -->
    <div style="height:900px"></div>
    <iframe id="embedded" title="Embedded report" width="420" height="90" style="border:1px solid #d7dbe0"
      srcdoc="&lt;button id=&quot;confirm&quot; style=&quot;font:14px system-ui;padding:8px 16px&quot;
                onclick=&quot;this.textContent='Report confirmed'&quot;&gt;Confirm the report&lt;/button&gt;"></iframe>
  </section>

  <section id="summary">
    <h3>Quarter summary</h3>
    <p>Nothing here is interactive. A tour of this page has to stop on it all the same.</p>
  </section>
</main>

<dialog id="detail">
  <header>User detail</header>
  <div class="body" id="detail_body"></div>
  <div class="actions"><button id="close_detail" class="secondary" type="button">Close</button></div>
</dialog>

<script>
  const USERS = [
    { code: 'U-1001', name: 'abc corporation', status: 'active' },
    { code: 'U-1002', name: 'abc holdings', status: 'suspended' },
    { code: 'U-1003', name: 'zeta industries', status: 'active' },
  ];

  const rows = document.getElementById('rows');
  const table = document.getElementById('results');
  const empty = document.getElementById('empty');

  const rowsShown = document.getElementById('rows_shown');
  rowsShown.addEventListener('input', () => {
    document.getElementById('rows_shown_value').textContent = rowsShown.value;
  });

  document.querySelector('.export').addEventListener('click', () => {
    document.getElementById('ask_result').textContent = 'Export queued';
  });

  document.getElementById('import_file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    document.getElementById('file_name').textContent = file ? `Chosen: ${file.name}` : 'No file chosen';
  });

  document.getElementById('search').addEventListener('click', () => {
    const term = document.getElementById('q_name_cont').value.trim().toLowerCase();
    const status = document.getElementById('q_status_eq').value;
    const found = USERS.filter((u) =>
      (!term || u.name.includes(term)) && (!status || u.status === status));

    rows.replaceChildren();
    for (const user of found) {
      const tr = document.createElement('tr');
      tr.id = `row_${user.code.replace('U-', '')}`;
      tr.innerHTML = `<td>${user.code}</td><td>${user.name}</td><td>${user.status}</td>`;
      const cell = document.createElement('td');
      const button = document.createElement('button');
      button.textContent = 'Detail';
      button.className = 'secondary';
      button.addEventListener('click', () => {
        document.getElementById('detail_body').textContent =
          `${user.name} (${user.code}) is currently ${user.status}.`;
        document.getElementById('detail').showModal();
      });
      cell.appendChild(button);
      tr.appendChild(cell);
      rows.appendChild(tr);
    }
    empty.hidden = found.length > 0;
    empty.textContent = found.length ? '' : 'No user matched those conditions.';
    table.hidden = found.length === 0;
  });

  document.getElementById('close_detail').addEventListener('click', () => {
    document.getElementById('detail').close();
  });
</script>
<script>
  // The audit trail, long enough that its button starts well below the fold.
  const trail = document.getElementById('history_items');
  for (let i = 1; i <= 24; i++) {
    const item = document.createElement('li');
    item.textContent = `2024-05-${String(i).padStart(2, '0')} 09:${String(i).padStart(2, '0')} — record U-10${i} updated`;
    trail.appendChild(item);
  }
  document.getElementById('archive').addEventListener('click', () => {
    document.getElementById('archive_result').textContent = 'The trail was archived.';
  });

  // Every scroll position the page passed through. A recording that jumps to the button leaves
  // one huge step here; one that scrolls the way a hand does leaves many small ones — which is
  // the difference the runner exists to make and the only place a test can see it without
  // looking at the video.
  window.__scrollSteps = [];
  let lastY = window.scrollY;
  window.addEventListener('scroll', () => {
    window.__scrollSteps.push(Math.abs(window.scrollY - lastY));
    lastY = window.scrollY;
  }, { passive: true });
</script>
<script>
  // A value that must not survive into the evidence, so the take can prove it did not
  document.getElementById('reveal_key').addEventListener('click', () => {
    document.getElementById('api_key').hidden = false;
  });

  // The browser's own dialogs. Chrome draws these itself, so a recording of page content cannot
  // contain them and a recording of the window can.
  document.getElementById('ask').addEventListener('click', () => {
    const result = document.getElementById('ask_result');
    result.textContent = confirm('Delete 3 selected users? This cannot be undone.')
      ? 'Deleted 3 users.'
      : 'Nothing was deleted.';
  });

  // A second button, so each dialog is triggered by one click and can be driven on its own
  document.getElementById('notify').addEventListener('click', () => {
    alert('A notice was sent to 3 users.');
  });

  // The one thing a recording of the browser cannot prove on its own: this button's real work
  // happens somewhere else. The server appends to a log file, and the take reads that log in the
  // terminal panel.
  document.getElementById('sync').addEventListener('click', async () => {
    const button = document.getElementById('sync');
    button.disabled = true;
    button.textContent = 'Sync queued';
    await fetch('/trigger', { method: 'POST' });
  });
</script>
</body>
</html>
